<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows 11 Desktop</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Roboto,sans-serif;color:#fff}
#desktop{position:fixed;inset:0;background:radial-gradient(circle at 25% 75%,#3a8cff 0,transparent 45%),radial-gradient(circle at 75% 25%,#8a5cf0 0,transparent 45%),linear-gradient(135deg,#0a2a6b,#1b5fd1 60%,#0b1f4d)}
#icons{position:absolute;top:40px;left:10px;display:grid;gap:14px}
.icon{width:76px;text-align:center;font-size:12px}
.icon b{display:block;font-size:34px;font-weight:400}
#taskbar{position:fixed;left:0;right:0;bottom:0;height:calc(52px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(32,32,40,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;gap:6px}
.tb{width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.tb:active{background:rgba(255,255,255,.18)}
.logo{display:grid;grid-template-columns:repeat(2,9px);gap:2px}
.logo i{width:9px;height:9px;background:#4cc2ff;border-radius:1px}
#tray{position:absolute;right:10px;top:0;bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;justify-content:center;text-align:right;font-size:11px;line-height:1.3}
#start{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(94vw,420px);max-height:70vh;overflow:auto;padding:16px;border-radius:12px;background:rgba(36,36,46,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12)}
.hide{display:none}
.search{padding:10px 14px;border-radius:20px;background:rgba(255,255,255,.1);font-size:14px;color:#ccc}
#start h4{margin:16px 0 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.app{text-align:center;font-size:11px;padding:8px 0;border-radius:8px}
.app:active{background:rgba(255,255,255,.12)}
.app b{display:block;font-size:26px;font-weight:400}
.foot{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
</style>
</head>
<body>
<div id="desktop">
  <div id="icons">
    <div class="icon"><b>💻</b>This PC</div>
    <div class="icon"><b>📁</b>Files</div>
    <div class="icon"><b>🗑️</b>Recycle Bin</div>
  </div>
</div>
<div id="start" class="hide">
  <div class="search">🔍 Type here to search</div>
  <h4>Pinned</h4>
  <div class="grid">
    <div class="app"><b>📁</b>Files</div>
    <div class="app"><b>📝</b>Notepad</div>
    <div class="app"><b>🧮</b>Calculator</div>
    <div class="app"><b>⌨️</b>Terminal</div>
    <div class="app"><b>🌐</b>Browser</div>
    <div class="app"><b>🎨</b>Paint</div>
    <div class="app"><b>⚙️</b>Settings</div>
    <div class="app"><b>🖼️</b>Photos</div>
  </div>
  <div class="foot"><span>👤 User</span><span>⏻</span></div>
</div>
<div id="taskbar">
  <div class="tb" id="startBtn"><div class="logo"><i></i><i></i><i></i><i></i></div></div>
  <div class="tb">🔍</div>
  <div class="tb">📁</div>
  <div class="tb">🌐</div>
  <div id="tray"><span id="time"></span><span id="date"></span></div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
function tick(){
  var d = new Date();
  $('time').textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  $('date').textContent = d.toLocaleDateString([], {day:'2-digit', month:'2-digit', year:'numeric'});
}
tick();
setInterval(tick, 1000);
$('startBtn').onclick = function(e){ e.stopPropagation(); $('start').classList.toggle('hide'); };
$('desktop').onclick = function(){ $('start').classList.add('hide'); };
</script>
</body>
</html>
